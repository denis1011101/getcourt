    privacy_policy:
      meta_title: "Política de privacidad — GetCourt"
      title: "Política de privacidad"
      last_updated: "Última actualización: mayo de 2026"
      who_we_are_title: "1. Quiénes somos"
      who_we_are_body: "GetCourt está operado por una persona física. No somos una entidad legal rusa ni empresario individual ruso. Contacto: hello@getcourt.co"
      data_collected_title: "2. Qué datos recopilamos"
      data_collected_body: "Dirección de email (necesaria para iniciar sesión), nombre y organización (opcional, solo para consultas de colaboración), geolocalización (opcional, solo cuando la permites en tu navegador), Telegram user ID (si conectas una cuenta de Telegram)."
      legal_basis_title: "3. Base legal del tratamiento (GDPR Art. 6)"
      legal_basis_contract: "Ejecución de contrato — tratamos tu email para prestar el servicio: inicio de sesión y participación en partidos."
      legal_basis_consent: "Consentimiento — la geolocalización y las consultas de colaboración se tratan solo con tu consentimiento explícito."
      legal_basis_legitimate: "Interés legítimo — notificaciones al operador por Telegram sobre consultas de colaboración."
      purposes_title: "4. Finalidades"
      purposes_body: "Autenticación y acceso a tu cuenta; mostrar pistas y partidos cercanos; responder a consultas de colaboración; notificaciones de Telegram si las activas."
      third_parties_title: "5. Terceros"
      third_parties_body: "Google Maps API — renderizado de mapas, sin cookies publicitarias establecidas por nosotros. Telegram — solo notificaciones al operador. Proveedor de hosting — servidores ubicados fuera de la UE y fuera de Rusia."
      transfers_title: "6. Transferencias internacionales"
      transfers_body: "Tus datos se tratan en servidores fuera de la Federación Rusa."
      retention_title: "7. Conservación"
      retention_body: "Conservamos tus datos hasta que elimines tu cuenta. Al eliminarla, todos los datos personales se borran permanentemente."
      rights_title: "8. Tus derechos"
      rights_access: "Derecho de acceso — solicitar una copia de tus datos."
      rights_rectification: "Derecho de rectificación — corregir datos inexactos en la configuración de la cuenta."
      rights_erasure: "Derecho de supresión — eliminar tu cuenta desde Cuenta → Eliminar cuenta."
      rights_restriction: "Derecho a la limitación — pedirnos que pausemos el tratamiento."
      rights_portability: "Derecho a la portabilidad — recibir tus datos en un formato legible por máquina."
      rights_objection: "Derecho de oposición — oponerte al tratamiento basado en interés legítimo."
      rights_automated: "Derecho a no ser objeto de decisiones automatizadas — no usamos perfilado automatizado."
      rights_how: "Para ejercer cualquier derecho, escribe a hello@getcourt.co. Respondemos en un plazo de 30 días."
      cookies_title: "9. Cookies"
      cookies_body: "Usamos cookies funcionales: una cookie de sesión para el inicio de sesión (1 año), una cookie de idioma preferido (1 año) y una cookie para ocultar el banner de idioma (1 semana). El tema de la interfaz y el estado del aviso de cookies se guardan en el localStorage del navegador. No usamos cookies publicitarias ni analíticas."
      russia_title: "10. Disposiciones especiales para usuarios en Rusia (152-ФЗ)"
      russia_body: "GetCourt está operado por una persona física fuera de Rusia. Si eres residente ruso, puedes enviar solicitudes relacionadas con datos personales a hello@getcourt.co. Atendemos dichas solicitudes en la medida aplicable."
      ccpa_title: "11. Disposiciones especiales para residentes de California (CCPA)"
      ccpa_body: "No vendemos tu información personal. Los residentes de California tienen derecho a saber qué información personal se recopila, derecho a eliminarla y derecho a optar por no venderla (no aplicable aquí). Contacta con hello@getcourt.co para ejercer estos derechos."
      children_title: "12. Privacidad de menores"
      children_body: "GetCourt no está dirigido a menores de 16 años. Al crear una cuenta confirmas que tienes al menos 16 años. Si sabemos que un usuario es menor de 16 años, eliminaremos sus datos."
      changes_title: "13. Cambios en esta política"
      changes_body: "Podemos actualizar esta política. Los cambios materiales se anunciarán en el sitio. El uso continuado después de los cambios constituye aceptación."
      contact_title: "14. Contacto"
      contact_body: "Email: hello@getcourt.co"
