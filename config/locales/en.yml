      who_we_are_title: "1. Who We Are"
      who_we_are_body: "GetCourt is operated by an individual. We are not a Russian legal entity or sole proprietor. Contact: hello@getcourt.co"
      data_collected_title: "2. What Data We Collect"
      data_collected_body: "Email address (required for sign-in), name and organisation (optional, partnership enquiries only), geolocation (optional, only when you allow it in your browser), Telegram user ID (if you connect a Telegram account)."
      legal_basis_title: "3. Legal Basis for Processing (GDPR Art. 6)"
      legal_basis_contract: "Performance of contract — we process your email to provide the service (sign-in, game participation)."
      legal_basis_consent: "Consent — geolocation and partnership enquiries are processed only with your explicit consent."
      legal_basis_legitimate: "Legitimate interest — operator notifications via Telegram (notifying us about partnership enquiries)."
      purposes_title: "4. Purposes"
      purposes_body: "Authentication and access to your account; displaying nearby courts and games; responding to partnership enquiries; Telegram notifications if you opt in."
      third_parties_title: "5. Third Parties"
      third_parties_body: "Google Maps API — map rendering, no advertising cookies set by us. Telegram — operator notifications only. Hosting provider — servers located outside the EU and outside Russia."
      transfers_title: "6. International Transfers"
      transfers_body: "Your data is processed on servers outside the Russian Federation."
      retention_title: "7. Retention"
      retention_body: "We retain your data until you delete your account. On deletion, all personal data is permanently erased."
      rights_title: "8. Your Rights"
      rights_access: "Right of access — request a copy of your data."
      rights_rectification: "Right to rectification — correct inaccurate data in Account settings."
      rights_erasure: "Right to erasure — delete your account via Account → Delete account."
      rights_restriction: "Right to restriction — ask us to pause processing."
      rights_portability: "Right to data portability — receive your data in a machine-readable format."
      rights_objection: "Right to object — object to processing based on legitimate interest."
      rights_automated: "Right not to be subject to automated decision-making — we do not use automated profiling."
      rights_how: "To exercise any right, email hello@getcourt.co. We respond within 30 days."
      cookies_title: "9. Cookies"
      cookies_body: "We use functional cookies: a session cookie for sign-in (1 year), a language preference cookie (1 year), and a locale banner dismissal cookie (1 week). The UI theme and cookie notice status are stored in browser localStorage. We do not use advertising or analytics cookies."
      russia_title: "10. Special Provisions for Users in Russia (152-ФЗ)"
      russia_body: "GetCourt is operated by an individual outside Russia. If you are a Russian resident, you may send personal data requests to hello@getcourt.co. We address such requests to the extent applicable."
      ccpa_title: "11. Special Provisions for California Residents (CCPA)"
      ccpa_body: "We do not sell your personal information. California residents have the right to know what personal information is collected, the right to delete it, and the right to opt out of sale (not applicable here). Contact hello@getcourt.co to exercise these rights."
      children_title: "12. Children's Privacy"
      children_body: "GetCourt is not directed at children under 16. By creating an account you confirm you are at least 16 years old. If we become aware that a user is under 16, we will delete their data."
      changes_title: "13. Changes to This Policy"
      changes_body: "We may update this policy. Material changes will be announced on the site. Continued use after changes constitutes acceptance."
      contact_title: "14. Contact"
      contact_body: "Email: hello@getcourt.co"
