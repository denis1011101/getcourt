  pages:
    ntrp:
      faq_q1: What is NTRP in tennis?
      faq_a1: NTRP (National Tennis Rating Program) is a standardized system for rating
        tennis players from 1.0 (beginner) to 7.0 (touring professional). It helps
        players find balanced matches and appropriate competition.
      faq_q2: How do I find my NTRP level?
      faq_a2: You can estimate your NTRP level by evaluating your consistency, shot
        variety, movement, serve, and match results. The best way to validate is to
        play competitive matches against players with known ratings.
      intro: NTRP (National Tennis Rating Program) is a standardized system for rating
        tennis players. It helps you find balanced matches by matching with players
        of a similar skill level. You can estimate your rating by evaluating your
        consistency, shot variety, movement, serve, and match results.
      start_quiz: Start Quiz
      retake_quiz: Retake quiz
      result_label: 'Your estimated level:'
      find_players: Find players at your level
      validate_note: The best way to validate your estimate is to play several competitive
        matches against players with known ratings and compare results.
      quiz:
        q1: 1/5 — How consistent are your rallies?
        q1_a1: I can keep the ball in play for a few shots but often miss
        q1_a2: I can sustain rallies at a moderate pace on most shots
        q1_a3: I rally consistently and can direct the ball with purpose
        q1_a4: I rarely miss in rallies and can control pace and depth
        q2: 2/5 — Describe your serve
        q2_a1: I can get the serve in but with little pace or spin
        q2_a2: I have a reliable first serve and a consistent second serve
        q2_a3: I can place my serve, vary speed, and sometimes use spin
        q2_a4: My serve is a weapon — I use pace, spin, and placement to win free
          points
        q3: 3/5 — How comfortable are you at the net?
        q3_a1: I avoid the net or struggle with volleys
        q3_a2: I can volley when I get an easy ball but don't come to the net often
        q3_a3: I approach the net with confidence and finish points with volleys
        q3_a4: I play aggressive net tennis, can handle passing shots and lobs
        q4: 4/5 — How would you describe your movement?
        q4_a1: I cover the court but am often late to wide balls
        q4_a2: I move well enough but get pulled out of position sometimes
        q4_a3: I recover quickly and use split-steps and lateral movement
        q4_a4: I anticipate shots and use footwork to set up offensive positions
        q5: 5/5 — How do you perform in matches?
        q5_a1: I lose focus and make many unforced errors under pressure
        q5_a2: I can compete but struggle to close out tight games
        q5_a3: I construct points and adapt my game to different opponents
        q5_a4: I thrive under pressure and can change tactics mid-match
      chart:
        level: Level
        groundstrokes: Groundstrokes
        serve_return: Serve & Return
        tactics: Tactics & Movement
        r1_g: Can rally at a moderate pace. Limited consistency under pressure. Forehand
          is stronger than backhand.
        r1_s: Gets the serve in but with little pace. Return is mostly defensive.
        r1_t: Covers the court but is often late. Relies on opponent errors rather
          than constructing points.
        r2_g: More reliable strokes on both sides. Starting to hit with direction
          and moderate topspin.
        r2_s: Reliable first serve with some pace. Second serve is consistent. Can
          return most serves.
        r2_t: 'Uses basic tactics: crosscourt rallies, approaches on short balls.
          Better court positioning.'
        r3_g: Consistent groundstrokes with directional control. Can hit winners from
          favorable positions.
        r3_s: Can place serves and vary speed. Aggressive returns on second serves.
        r3_t: Constructs points with depth and angles. Good movement and recovery.
          Comfortable at the net.
        r4_g: Strong all-court game. Controls pace and spin. Handles high balls and
          low slices effectively.
        r4_s: Serve is a weapon with pace and spin variation. Returns are offensive.
        r4_t: Advanced patterns and court awareness. Uses split-steps and anticipation.
          Adapts tactics to opponents.
        r5_g: Powerful, reliable strokes with tactical flexibility. Can dictate rallies
          from both wings.
        r5_s: Consistent first-serve percentage with placement. Effective kick and
          slice serves.
        r5_t: Exceptional movement and shot selection. Dominates weaker opponents
          and competes with top-level players.
        r6_g: Tournament-quality strokes. High consistency even under pressure. Shot
          variety includes dropshots, angles.
        r6_s: Serve sets up the point. Can ace opponents and hit second-serve winners.
        r6_t: Match management under pressure. Changes tactics mid-match. Plays at
          a high competitive level.
        r7_g: Elite-level strokes. Has had intensive training and national/international
          results.
        r7_s: Professional-level serve and return game.
        r7_t: Complete game. Competing at national or international level.
      levels:
        '2_5': You are a beginner — you can rally at a moderate pace, but consistency
          drops under pressure.
        '3_0': You are developing — rallies are more sustained and you're starting
          to use basic tactics.
        '3_5': Intermediate level — more reliable strokes, basic tactics, and better
          court positioning.
        '4_0': Advanced intermediate — consistent serves and groundstrokes, directional
          control, and point construction.
        '4_5': Advanced — strong all-court game, pace control, advanced patterns,
          and high match consistency.
        '5_0': Strong advanced — powerful, reliable strokes with tactical flexibility.
        '5_5': Tournament-level — exceptional consistency, shot variety, and match
          management under pressure.
        '6_0': Elite-level competitor with national/international training and results.
    formats:
      schema_headline: Fun Tennis Game Formats and Group Drills
      schema_description: 'Popular tennis group formats with rules and court diagrams:
        King of the Court, 2v2 with two balls, 3-courts promotion system.'
      players_4_8: 4–8 players
      players_4: 4 players
      players_3: 3 players
      courts_1: 1 court
      courts_1_2: 1–2 courts
      singles_or_doubles: Singles or Doubles
      doubles: Doubles
      singles: Singles
      scoring: Scoring
      king:
        title: King of the Court
        body: One side of the court is the "King" side. Challengers rotate in from
          the other side and try to win a point. If the challenger wins, they become
          the King. If the King wins, the challenger rotates out and the next one
          comes in.
        score_1: Each point won as King counts as 1 point
        score_2: Play to a target score (e.g., 10) or by timed rounds (5 min)
        score_3: The player with the most points at the end wins
        variations: Variations
        var_1_html: "<strong>Doubles King:</strong> teams of 2, challengers rotate
          as pairs"
        var_2_html: "<strong>Serve King:</strong> King always serves to keep an advantage"
        diagram_side: KING SIDE
        diagram_waiting: waiting
      two_balls:
        title: 2 vs 2 with Two Balls
        body_html: Standard 2v2 doubles, but the serving team feeds <strong>two balls
          at once</strong> from one side. Both rallies run simultaneously — chaos,
          speed, and great fun. When one ball goes out of play, someone shouts <strong>"Ball!"</strong>
          and both teams switch to playing the remaining (main) ball with standard
          doubles rules.
        score_1_html: Points are scored with the <strong>main ball</strong> only (after
          one ball drops out)
        score_2: First team to 10 points wins (or set your own target)
        score_3: Serve switches after each point as in regular doubles
        safety_title: Safety tip
        safety_body: Stay aware of both balls at all times. Shout "Ball!" clearly
          so everyone switches focus to the main ball immediately.
        diagram_balls: 2 balls →
      three_pairs:
        title: 3 Pairs — Scoreboard Format
        body: Three players share one court. Two play a singles point while the third
          stands at the net post and keeps score. After each point, the loser steps
          off and the scorer steps in — the scorer becomes the new challenger, and
          the previous loser takes over scoring.
        scoreboard_title: Scoreboard
        scoreboard_body: A standard tennis scoreboard tracks each player combination
          separately — one row per pair (A vs B, A vs C, B vs C). The scorer updates
          the row for the current match after each point.
        rule_1: Each row is played to a set score (e.g., 6 points)
        rule_2: Winner stays on court, loser becomes the new scorer
        rule_3: Most wins across all rows at the end of the session wins
        why_title: Why it works
        why_body: Nobody waits idly — the third player is always involved as scorer.
          Rotations are fast and the session never drags.
        pair_ab: Pair A vs B
        pair_ac: Pair A vs C
        pair_bc: Pair B vs C
        diagram_note: Resting pair keeps score
      round_robin:
        title: Round Robin
        body: Every player plays a short match (e.g., one set or a timed period) against
          every other player. Results are tracked on a scoreboard. The player with
          the most wins at the end is the champion.
        score_1: Win = 2 points, loss = 0 points (or 3/1/0 for win/close-loss/loss)
        score_2: 'Tiebreaker: head-to-head result, then games difference'
        note: Round Robin ensures everyone plays the same number of matches and is
          the fairest format for small groups.
      drills:
        title: Classic Group Drills
        subtitle: Warm-up or practice exercises to run before a game session. No scoring
          — focus is on technique and movement.
        d1_title: Cross-Court Rally
        d1_body: Two players rally crosscourt continuously — one hitting forehands,
          the other backhands. Switch sides after 3–5 minutes. Great for consistency
          and footwork warm-up.
        d1_meta: 2 players · 1 half of the court
        d2_title: Basket Feed — Down the Line
        d2_body: One player feeds balls from a basket at the net while the other hits
          down the line from the baseline, alternating forehand and backhand. Focuses
          on placement and swing path.
        d2_meta: 2 players · 1 basket of balls
        d3_title: Volley-to-Volley
        d3_body: Both players stand at their respective service lines and volley back
          and forth without letting the ball bounce. Keep the rally going as long
          as possible. Excellent for reflexes and net technique.
        d3_meta: 2 players · 1 court
        d4_title: Figure-8 Rally
        d4_body: Player A always hits crosscourt, Player B always hits down the line
          — the ball traces a figure-8 pattern across the net. Switch roles every
          5 minutes. Builds directional control and anticipation.
        d4_meta: 2 players · full court
        d5_title: Australian Formation Serve Practice
        d5_body: 'Doubles drill: server and net partner line up on the same side of
          the center line (Australian formation). Server practices T-serves while
          net partner practices aggressive volleying. Receiver practices returning
          wide.'
        d5_meta: 4 players · full court
