      rights_access: "Право на доступ — запросить копию ваших данных."
      rights_rectification: "Право на исправление — исправить неточные данные в настройках аккаунта."
      rights_erasure: "Право на удаление — удалить аккаунт через Аккаунт → Удалить аккаунт."
      rights_restriction: "Право на ограничение обработки — попросить нас приостановить обработку."
      rights_portability: "Право на переносимость — получить данные в машиночитаемом формате."
      rights_objection: "Право на возражение — возразить против обработки на основании законного интереса."
      rights_automated: "Право не быть объектом автоматизированных решений — мы не используем автоматическое профилирование."
      rights_how: "Чтобы воспользоваться любым правом, напишите на hello@getcourt.co. Мы отвечаем в течение 30 дней."
      cookies_title: "9. Cookies"
      cookies_body: "Мы используем функциональные cookies: сессионный cookie для входа в аккаунт (1 год), cookie выбранного языка (1 год) и cookie скрытия баннера смены языка (1 неделя). Кроме того, тема оформления и статус уведомления о cookies хранятся в localStorage браузера. Мы не используем рекламные или аналитические cookies."
      russia_title: "10. Особые положения для пользователей из России (152-ФЗ)"
      russia_body: "GetCourt управляется физическим лицом за пределами России. Если вы являетесь резидентом России, вы можете направлять запросы, связанные с персональными данными, на hello@getcourt.co. Мы рассматриваем такие запросы в применимой части."
      ccpa_title: "11. Особые положения для резидентов Калифорнии (CCPA)"
      ccpa_body: "Мы не продаём ваши персональные данные. Резиденты Калифорнии имеют право знать, какие персональные данные собираются, право удалить их и право отказаться от продажи (здесь неприменимо). Для реализации прав напишите на hello@getcourt.co."
      children_title: "12. Конфиденциальность детей"
      children_body: "GetCourt не предназначен для детей младше 16 лет. Создавая аккаунт, вы подтверждаете, что вам не менее 16 лет. Если мы узнаем, что пользователю меньше 16 лет, мы удалим его данные."
      changes_title: "13. Изменения политики"
      changes_body: "Мы можем обновлять эту политику. О существенных изменениях будет объявлено на сайте. Продолжение использования после изменений означает принятие."
      contact_title: "14. Контакты"
      contact_body: "Email: hello@getcourt.co"
