  pages:
    ntrp:
      faq_q1: Что такое NTRP в теннисе?
      faq_a1: NTRP (National Tennis Rating Program) — стандартизированная система
        оценки теннисистов от 1.0 (новичок) до 7.0 (профессионал тура). Она помогает
        подбирать равных соперников и подходящий уровень соревнований.
      faq_q2: Как определить свой уровень NTRP?
      faq_a2: Оценить уровень NTRP можно по стабильности, разнообразию ударов, передвижению,
        подаче и результатам матчей. Лучший способ проверки — сыграть несколько соревновательных
        матчей с игроками, чей рейтинг известен.
      intro: NTRP (National Tennis Rating Program) — стандартизированная система оценки
        теннисистов. Она помогает находить равные матчи с игроками схожего уровня.
        Оценить свой рейтинг можно по стабильности, разнообразию ударов, передвижению,
        подаче и результатам матчей.
      start_quiz: Пройти тест
      retake_quiz: Пройти заново
      result_label: 'Ваш примерный уровень:'
      find_players: Найти игроков своего уровня
      validate_note: Лучший способ проверить оценку — сыграть несколько соревновательных
        матчей с игроками, чей рейтинг известен, и сравнить результаты.
      quiz:
        q1: 1/5 — Насколько стабильны ваши розыгрыши?
        q1_a1: Могу продержать мяч в игре несколько ударов, но часто ошибаюсь
        q1_a2: Держу розыгрыш в среднем темпе на большинстве ударов
        q1_a3: Играю стабильно и могу осознанно направлять мяч
        q1_a4: Почти не ошибаюсь в розыгрышах, контролирую темп и глубину
        q2: 2/5 — Опишите свою подачу
        q2_a1: Подачу попадаю, но без скорости и вращения
        q2_a2: Есть надёжная первая подача и стабильная вторая
        q2_a3: Могу направлять подачу, менять скорость, иногда добавляю вращение
        q2_a4: 'Подача — моё оружие: скорость, вращение и точность приносят лёгкие
          очки'
        q3: 3/5 — Насколько уверенно вы чувствуете себя у сетки?
        q3_a1: Избегаю сетки или плохо играю с лёта
        q3_a2: Играю с лёта на простых мячах, но к сетке выхожу редко
        q3_a3: Уверенно выхожу к сетке и завершаю розыгрыши с лёта
        q3_a4: Играю агрессивно у сетки, справляюсь с обводкой и свечами
        q4: 4/5 — Как бы вы описали своё передвижение?
        q4_a1: Покрываю корт, но часто не успеваю к широким мячам
        q4_a2: Двигаюсь неплохо, но иногда выпадаю из позиции
        q4_a3: Быстро возвращаюсь в позицию, использую сплит-степ и боковое передвижение
        q4_a4: Предугадываю удары и работой ног готовлю атакующие позиции
        q5: 5/5 — Как вы играете в матчах?
        q5_a1: Теряю концентрацию и много ошибаюсь под давлением
        q5_a2: Могу бороться, но с трудом дожимаю концовки
        q5_a3: Выстраиваю розыгрыши и подстраиваюсь под разных соперников
        q5_a4: Хорошо играю под давлением и могу менять тактику по ходу матча
      chart:
        level: Уровень
        groundstrokes: Удары с задней линии
        serve_return: Подача и приём
        tactics: Тактика и передвижение
        r1_g: Держит розыгрыш в среднем темпе. Стабильность падает под давлением.
          Форхенд сильнее бэкхенда.
        r1_s: Подачу попадает, но без скорости. Приём в основном оборонительный.
        r1_t: Покрывает корт, но часто не успевает. Рассчитывает на ошибки соперника,
          а не строит розыгрыш.
        r2_g: Более надёжные удары с обеих сторон. Появляются направление и умеренный
          топспин.
        r2_s: Надёжная первая подача с некоторой скоростью. Вторая стабильна. Принимает
          большинство подач.
        r2_t: 'Использует базовую тактику: кросс-розыгрыши, выход на коротких мячах.
          Лучше держит позицию.'
        r3_g: Стабильные удары с контролем направления. Может пробивать навылет из
          удобных позиций.
        r3_s: Может направлять подачу и менять скорость. Агрессивно принимает вторую
          подачу.
        r3_t: Строит розыгрыш глубиной и углами. Хорошо двигается и возвращается.
          Уверенно играет у сетки.
        r4_g: Сильная игра по всему корту. Контролирует темп и вращение. Уверенно
          играет высокие мячи и низкие резаные.
        r4_s: Подача — оружие, с вариациями скорости и вращения. Приём атакующий.
        r4_t: Продвинутые схемы и понимание корта. Использует сплит-степ и предугадывание.
          Подстраивает тактику под соперника.
        r5_g: Мощные и надёжные удары с тактической гибкостью. Может диктовать игру
          с обеих сторон.
        r5_s: Стабильный процент первой подачи с точностью. Эффективные кручёные и
          резаные подачи.
        r5_t: Отличное передвижение и выбор удара. Уверенно обыгрывает более слабых
          и борется с сильными.
        r6_g: Удары турнирного уровня. Высокая стабильность даже под давлением. В
          арсенале укороченные и острые углы.
        r6_s: Подача готовит розыгрыш. Может подавать эйсы и выигрывать со второй
          подачи.
        r6_t: Управление матчем под давлением. Меняет тактику по ходу игры. Играет
          на высоком соревновательном уровне.
        r7_g: Удары элитного уровня. Интенсивная подготовка и результаты национального/международного
          уровня.
        r7_s: Подача и приём профессионального уровня.
        r7_t: Полноценная игра. Выступает на национальном или международном уровне.
      levels:
        '2_5': Вы новичок — держите розыгрыш в среднем темпе, но под давлением стабильность
          падает.
        '3_0': Вы развиваетесь — розыгрыши длиннее, начинаете использовать базовую
          тактику.
        '3_5': Средний уровень — более надёжные удары, базовая тактика и лучшая позиция
          на корте.
        '4_0': Выше среднего — стабильные подача и удары с задней линии, контроль
          направления, построение розыгрыша.
        '4_5': Продвинутый уровень — сильная игра по всему корту, контроль темпа,
          продвинутые схемы и высокая стабильность.
        '5_0': Уверенный продвинутый — мощные и надёжные удары с тактической гибкостью.
        '5_5': Турнирный уровень — исключительная стабильность, разнообразие ударов
          и управление матчем под давлением.
        '6_0': Игрок элитного уровня с интенсивной подготовкой и результатами национального/международного
          уровня.
    formats:
      schema_headline: Весёлые форматы теннисных игр и групповые упражнения
      schema_description: 'Популярные групповые форматы тенниса с правилами и схемами
        корта: «Король корта», 2 на 2 с двумя мячами, система на 3 корта.'
      players_4_8: 4–8 игроков
      players_4: 4 игрока
      players_3: 3 игрока
      courts_1: 1 корт
      courts_1_2: 1–2 корта
      singles_or_doubles: Одиночный или парный
      doubles: Парный
      singles: Одиночный
      scoring: Подсчёт очков
      king:
        title: Король корта
        body: Одна сторона корта — сторона «Короля». Претенденты по очереди выходят
          с другой стороны и пытаются выиграть очко. Если выигрывает претендент, он
          становится Королём. Если выигрывает Король, претендент уходит и заходит
          следующий.
        score_1: Каждое очко, выигранное в роли Короля, — 1 балл
        score_2: Играют до целевого счёта (например, 10) или раундами по времени (5
          минут)
        score_3: Побеждает игрок с наибольшим количеством очков
        variations: Варианты
        var_1_html: "<strong>Парный Король:</strong> команды по 2 человека, претенденты
          меняются парами"
        var_2_html: "<strong>Подающий Король:</strong> Король всегда подаёт, сохраняя
          преимущество"
        diagram_side: СТОРОНА КОРОЛЯ
        diagram_waiting: ожидают
      two_balls:
        title: 2 на 2 с двумя мячами
        body_html: Обычный парный формат, но подающая команда вводит в игру <strong>сразу
          два мяча</strong> с одной стороны. Оба розыгрыша идут одновременно — хаос,
          скорость и много веселья. Когда один мяч выходит из игры, кто-нибудь кричит
          <strong>«Мяч!»</strong>, и обе команды переходят на оставшийся (основной)
          мяч по обычным парным правилам.
        score_1_html: Очки считаются только по <strong>основному мячу</strong> (после
          того как один мяч вышел из игры)
        score_2: Побеждает команда, первой набравшая 10 очков (или свой целевой счёт)
        score_3: Подача переходит после каждого очка, как в обычном парном
        safety_title: О безопасности
        safety_body: Всё время следите за обоими мячами. Чётко кричите «Мяч!», чтобы
          все сразу переключились на основной мяч.
        diagram_balls: 2 мяча →
      three_pairs:
        title: 3 пары — формат с табло
        body: Три игрока делят один корт. Двое разыгрывают очко в одиночном формате,
          третий стоит у стойки сетки и ведёт счёт. После каждого очка проигравший
          уходит, а счётчик выходит на корт — счётчик становится новым претендентом,
          а проигравший берёт на себя счёт.
        scoreboard_title: Табло
        scoreboard_body: Обычное теннисное табло ведёт счёт отдельно для каждой комбинации
          игроков — по строке на пару (A против B, A против C, B против C). Счётчик
          обновляет строку текущего матча после каждого очка.
        rule_1: Каждая строка играется до фиксированного счёта (например, 6 очков)
        rule_2: Победитель остаётся на корте, проигравший становится новым счётчиком
        rule_3: Побеждает тот, у кого больше побед по всем строкам к концу сессии
        why_title: Почему это работает
        why_body: Никто не простаивает — третий игрок всегда занят счётом. Ротация
          быстрая, и сессия не затягивается.
        pair_ab: Пара A против B
        pair_ac: Пара A против C
        pair_bc: Пара B против C
        diagram_note: Отдыхающая пара ведёт счёт
      round_robin:
        title: Круговой турнир
        body: Каждый игрок проводит короткий матч (например, один сет или отрезок
          по времени) с каждым другим. Результаты фиксируются на табло. Побеждает
          тот, у кого больше всего побед.
        score_1: Победа = 2 очка, поражение = 0 очков (или 3/1/0 за победу/близкое
          поражение/поражение)
        score_2: 'Тай-брейк: личная встреча, затем разница геймов'
        note: Круговой турнир гарантирует всем одинаковое число матчей и является
          самым честным форматом для небольших групп.
      drills:
        title: Классические групповые упражнения
        subtitle: Разминка или отработка перед игровой сессией. Без счёта — упор на
          технику и передвижение.
        d1_title: Розыгрыш по диагонали
        d1_body: Двое непрерывно играют по диагонали — один справа, другой слева.
          Через 3–5 минут меняются сторонами. Отлично для стабильности и разминки
          работы ног.
        d1_meta: 2 игрока · половина корта
        d2_title: Подброс из корзины — по линии
        d2_body: Один игрок подбрасывает мячи из корзины у сетки, другой бьёт по линии
          с задней линии, чередуя форхенд и бэкхенд. Упор на точность и траекторию
          замаха.
        d2_meta: 2 игрока · корзина мячей
        d3_title: Игра с лёта
        d3_body: Оба игрока стоят на своих линиях подачи и играют с лёта, не давая
          мячу приземлиться. Держите розыгрыш как можно дольше. Отлично для реакции
          и техники у сетки.
        d3_meta: 2 игрока · 1 корт
        d4_title: Розыгрыш «восьмёркой»
        d4_body: Игрок A всегда бьёт по диагонали, игрок B — всегда по линии; мяч
          рисует восьмёрку через сетку. Меняйтесь ролями каждые 5 минут. Развивает
          контроль направления и предугадывание.
        d4_meta: 2 игрока · весь корт
        d5_title: Отработка подачи в австралийской расстановке
        d5_body: 'Парное упражнение: подающий и партнёр у сетки становятся по одну
          сторону от центральной линии (австралийская расстановка). Подающий отрабатывает
          подачу в «Т», партнёр — агрессивную игру с лёта. Принимающий отрабатывает
          приём по широкой.'
        d5_meta: 4 игрока · весь корт
