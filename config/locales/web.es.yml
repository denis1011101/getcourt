        '4_5': 'Avanzado: juego fuerte en toda la pista, control del ritmo, patrones
          avanzados y alta regularidad.'
        '5_0': 'Avanzado alto: golpes potentes y fiables con flexibilidad táctica.'
        '5_5': 'Nivel de torneo: regularidad excepcional, variedad de golpes y gestión
          del partido bajo presión.'
        '6_0': Competidor de nivel élite con formación y resultados nacionales/internacionales.
    formats:
      schema_headline: Formatos divertidos de partidos de tenis y ejercicios en grupo
      schema_description: 'Formatos de tenis en grupo con reglas y esquemas de pista:
        Rey de la pista, 2v2 con dos bolas, sistema de ascenso en 3 pistas.'
      players_4_8: 4–8 jugadores
      players_4: 4 jugadores
      players_3: 3 jugadores
      courts_1: 1 pista
      courts_1_2: 1–2 pistas
      singles_or_doubles: Individual o dobles
      doubles: Dobles
      singles: Individual
      scoring: Puntuación
      king:
        title: Rey de la pista
        body: Un lado de la pista es el lado del «Rey». Los aspirantes van entrando
          desde el otro lado e intentan ganar un punto. Si gana el aspirante, se convierte
          en el Rey. Si gana el Rey, el aspirante sale y entra el siguiente.
        score_1: Cada punto ganado como Rey vale 1 punto
        score_2: Se juega a una puntuación objetivo (p. ej. 10) o por rondas cronometradas
          (5 min)
        score_3: Gana quien tenga más puntos al final
        variations: Variantes
        var_1_html: "<strong>Rey en dobles:</strong> equipos de 2, los aspirantes
          entran por parejas"
        var_2_html: "<strong>Rey al saque:</strong> el Rey siempre saca para mantener
          la ventaja"
        diagram_side: LADO DEL REY
        diagram_waiting: esperando
      two_balls:
        title: 2 contra 2 con dos bolas
        body_html: 'Dobles 2v2 normales, pero el equipo al saque pone <strong>dos
          bolas a la vez</strong> desde un lado. Los dos peloteos van simultáneos:
          caos, velocidad y mucha diversión. Cuando una bola sale de juego, alguien
          grita <strong>«¡Bola!»</strong> y ambos equipos siguen con la bola restante
          (la principal) según las reglas normales de dobles.'
        score_1_html: Los puntos se cuentan solo con la <strong>bola principal</strong>
          (después de que una bola salga de juego)
        score_2: Gana el primer equipo que llegue a 10 puntos (o a la meta que fijéis)
        score_3: El saque cambia tras cada punto, como en los dobles normales
        safety_title: Consejo de seguridad
        safety_body: Estad atentos a las dos bolas en todo momento. Gritad «¡Bola!»
          con claridad para que todos pasen de inmediato a la bola principal.
        diagram_balls: 2 bolas →
      three_pairs:
        title: 3 parejas — formato con marcador
        body: 'Tres jugadores comparten una pista. Dos juegan un punto individual
          mientras el tercero se coloca junto al poste de la red y lleva el marcador.
          Tras cada punto, el perdedor sale y entra quien llevaba el marcador: pasa
          a ser el nuevo aspirante y el perdedor se encarga del marcador.'
        scoreboard_title: Marcador
        scoreboard_body: 'Un marcador de tenis normal registra cada combinación de
          jugadores por separado: una fila por pareja (A vs B, A vs C, B vs C). Quien
          lleva el marcador actualiza la fila del partido en curso tras cada punto.'
        rule_1: Cada fila se juega hasta una puntuación fijada (p. ej. 6 puntos)
        rule_2: El ganador se queda en pista y el perdedor pasa a llevar el marcador
        rule_3: Gana quien más victorias sume en todas las filas al final de la sesión
        why_title: Por qué funciona
        why_body: 'Nadie espera parado: el tercer jugador siempre participa llevando
          el marcador. Las rotaciones son rápidas y la sesión no se hace larga.'
        pair_ab: Pareja A vs B
        pair_ac: Pareja A vs C
        pair_bc: Pareja B vs C
        diagram_note: La pareja que descansa lleva el marcador
      round_robin:
        title: Round Robin
        body: Cada jugador disputa un partido corto (p. ej. un set o un tiempo fijado)
          contra todos los demás. Los resultados se anotan en un marcador. Quien más
          victorias sume al final es el campeón.
        score_1: Victoria = 2 puntos, derrota = 0 puntos (o 3/1/0 por victoria/derrota
          ajustada/derrota)
        score_2: 'Desempate: resultado directo y después diferencia de juegos'
        note: El Round Robin garantiza que todos jueguen el mismo número de partidos
          y es el formato más justo para grupos pequeños.
      drills:
        title: Ejercicios clásicos en grupo
        subtitle: 'Calentamiento o práctica antes de una sesión de partidos. Sin puntuación:
          el foco está en la técnica y el movimiento.'
        d1_title: Peloteo cruzado
        d1_body: 'Dos jugadores pelotean en cruzado de forma continua: uno de derecha
          y otro de revés. Cambiad de lado cada 3–5 minutos. Ideal para la regularidad
          y para calentar el juego de pies.'
        d1_meta: 2 jugadores · media pista
        d2_title: Alimentación con cesto — paralelo
        d2_body: Un jugador alimenta bolas desde un cesto en la red mientras el otro
          golpea paralelo desde el fondo, alternando derecha y revés. Se trabaja la
          colocación y la trayectoria del swing.
        d2_meta: 2 jugadores · 1 cesto de bolas
        d3_title: Volea contra volea
        d3_body: Ambos jugadores se sitúan en sus líneas de saque y volean de ida
          y vuelta sin dejar botar la bola. Aguantad el peloteo el mayor tiempo posible.
          Excelente para los reflejos y la técnica en la red.
        d3_meta: 2 jugadores · 1 pista
        d4_title: Peloteo en forma de 8
        d4_body: 'El jugador A golpea siempre cruzado y el jugador B siempre paralelo:
          la bola dibuja un 8 sobre la red. Cambiad de rol cada 5 minutos. Desarrolla
          el control direccional y la anticipación.'
        d4_meta: 2 jugadores · pista completa
        d5_title: Práctica de saque en formación australiana
        d5_body: 'Ejercicio de dobles: el que saca y su compañero de red se colocan
          del mismo lado de la línea central (formación australiana). El sacador practica
          el saque a la T y el compañero, la volea agresiva. El restador practica
          el resto abierto.'
        d5_meta: 4 jugadores · pista completa
