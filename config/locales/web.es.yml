  pages:
    ntrp:
      faq_q1: "¿Qué es el NTRP en tenis?"
      faq_a1: El NTRP (National Tennis Rating Program) es un sistema estandarizado
        para valorar a los jugadores de tenis del 1.0 (principiante) al 7.0 (profesional
        del circuito). Ayuda a encontrar partidos equilibrados y una competición adecuada.
      faq_q2: "¿Cómo sé cuál es mi nivel NTRP?"
      faq_a2: Puedes estimar tu nivel NTRP valorando tu regularidad, variedad de golpes,
        movimiento, servicio y resultados en partido. La mejor forma de validarlo
        es jugar partidos competitivos contra jugadores con rating conocido.
      intro: El NTRP (National Tennis Rating Program) es un sistema estandarizado
        para valorar a los jugadores de tenis. Te ayuda a encontrar partidos equilibrados
        con jugadores de nivel similar. Puedes estimar tu rating valorando tu regularidad,
        variedad de golpes, movimiento, servicio y resultados en partido.
      start_quiz: Empezar test
      retake_quiz: Repetir el test
      result_label: 'Tu nivel estimado:'
      find_players: Encuentra jugadores de tu nivel
      validate_note: La mejor forma de validar tu estimación es jugar varios partidos
        competitivos contra jugadores con rating conocido y comparar resultados.
      quiz:
        q1: 1/5 — ¿Cómo de regular eres en los peloteos?
        q1_a1: Mantengo la bola unos pocos golpes, pero fallo a menudo
        q1_a2: Aguanto peloteos a ritmo moderado en la mayoría de golpes
        q1_a3: Peloteo con regularidad y puedo dirigir la bola con intención
        q1_a4: Casi nunca fallo en el peloteo y controlo ritmo y profundidad
        q2: 2/5 — Describe tu servicio
        q2_a1: Meto el servicio, pero con poca velocidad o efecto
        q2_a2: Tengo un primer servicio fiable y un segundo constante
        q2_a3: Puedo colocar el servicio, variar la velocidad y a veces usar efecto
        q2_a4: 'Mi servicio es un arma: uso velocidad, efecto y colocación para ganar
          puntos directos'
        q3: 3/5 — ¿Cómo te sientes en la red?
        q3_a1: Evito la red o me cuestan las voleas
        q3_a2: Volea cuando la bola es fácil, pero subo poco a la red
        q3_a3: Subo a la red con confianza y cierro puntos con la volea
        q3_a4: Juego una red agresiva y manejo passings y globos
        q4: 4/5 — ¿Cómo describirías tu movimiento?
        q4_a1: Cubro la pista, pero llego tarde a las bolas abiertas
        q4_a2: Me muevo bien, pero a veces me sacan de posición
        q4_a3: Recupero rápido y uso split-step y desplazamiento lateral
        q4_a4: Anticipo los golpes y uso el juego de pies para crear posiciones ofensivas
        q5: 5/5 — ¿Cómo rindes en los partidos?
        q5_a1: Pierdo concentración y cometo muchos errores no forzados bajo presión
        q5_a2: Compito, pero me cuesta cerrar los juegos ajustados
        q5_a3: Construyo los puntos y adapto mi juego a cada rival
        q5_a4: Rindo bien bajo presión y puedo cambiar de táctica durante el partido
      chart:
        level: Nivel
        groundstrokes: Golpes de fondo
        serve_return: Servicio y resto
        tactics: Táctica y movimiento
        r1_g: Pelotea a ritmo moderado. Regularidad limitada bajo presión. La derecha
          es más fuerte que el revés.
        r1_s: Mete el servicio pero con poca velocidad. El resto es sobre todo defensivo.
        r1_t: Cubre la pista pero llega tarde a menudo. Depende del error del rival
          más que de construir el punto.
        r2_g: Golpes más fiables por ambos lados. Empieza a dirigir la bola y a dar
          topspin moderado.
        r2_s: Primer servicio fiable con algo de velocidad. Segundo servicio constante.
          Resta la mayoría de servicios.
        r2_t: 'Usa táctica básica: peloteos cruzados, subidas en bolas cortas. Mejor
          colocación en pista.'
        r3_g: Golpes de fondo constantes con control direccional. Puede golpear ganadores
          desde posiciones favorables.
        r3_s: Puede colocar el servicio y variar la velocidad. Restos agresivos al
          segundo servicio.
        r3_t: Construye el punto con profundidad y ángulos. Buen movimiento y recuperación.
          Cómodo en la red.
        r4_g: Juego fuerte en toda la pista. Controla ritmo y efecto. Maneja bien
          bolas altas y cortadas bajas.
        r4_s: El servicio es un arma con variación de velocidad y efecto. Los restos
          son ofensivos.
        r4_t: Patrones avanzados y buena lectura de pista. Usa split-step y anticipación.
          Adapta la táctica al rival.
        r5_g: Golpes potentes y fiables con flexibilidad táctica. Puede dictar el
          peloteo por ambos lados.
        r5_s: Porcentaje constante de primer servicio con colocación. Servicios liftados
          y cortados eficaces.
        r5_t: Movimiento y selección de golpe excepcionales. Domina a rivales inferiores
          y compite con los mejores.
        r6_g: Golpes de nivel de torneo. Alta regularidad incluso bajo presión. Variedad
          con dejadas y ángulos.
        r6_s: El servicio prepara el punto. Puede hacer aces y ganadores con el segundo
          servicio.
        r6_t: Gestiona el partido bajo presión. Cambia de táctica durante el encuentro.
          Juega a alto nivel competitivo.
        r7_g: Golpes de nivel élite. Entrenamiento intensivo y resultados nacionales/internacionales.
        r7_s: Servicio y resto de nivel profesional.
        r7_t: Juego completo. Compite a nivel nacional o internacional.
      levels:
