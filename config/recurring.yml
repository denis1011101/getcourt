# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Напоминания об играх: отдельные задачи на «завтра» (args 1) и «сегодня» (args 0).
  game_reminders_tomorrow:
    class: GameReminderJob
    args: [ 1 ]
    schedule: at 2pm every day
  game_reminders:
    class: GameReminderJob
    args: [ 0 ]
    schedule: at 2pm every day
  # Раз в неделю, в ночь с пятницы на субботу — как это делала кроновая строка
  # `participations:reset` (она с этой даты закомментирована). Ежедневный запуск,
  # стоявший здесь с 2026-08-15, вычищал состав на следующее же утро после игры,
  # а не раз в неделю.
  reset_participations:
    class: ResetParticipationsJob
    schedule: every saturday at 4am
  # В ту же ночь, что и сброс: до неё состав и чат прошедшей игры живы, после —
  # нет. Раньше обе задачи ходили из /etc/cron.d/getcourt по пятницам; кроновые
  # строки с 2026-09-02 закомментированы.
  cleanup_past_one_off_games:
    class: CleanupPastOneOffGamesJob
    schedule: every saturday at 4:15am
  cleanup_past_tournaments:
    class: CleanupPastTournamentsJob
    schedule: every saturday at 4:30am
  reset_inactive_player_statistics:
    class: ResetInactivePlayerStatisticsJob
    schedule: at 4:30am every day
  cleanup_old_game_media:
    class: CleanupOldGameMediaJob
    schedule: at 5am every day
  # В 7 утра, как и кроновая строка, которую эта задача заменяет. Время идёт по
  # config.time_zone (Asia/Yekaterinburg) — тому же, что стоял в CRON_TZ.
  generate_sitemap:
    class: GenerateSitemapJob
    schedule: at 7am every day
  # Вечер в РФ, день в Европе, утро в Америке. Аккаунты англоязычные, так что
  # при смене целевой аудитории двигать надо именно эту строку.
  daily_social_post:
    class: PostDailySocialPostJob
    schedule: at 6pm every day
