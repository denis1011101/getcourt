version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  # Свежий релиз экшена не предлагаем неделю: скомпрометированные теги
  # обычно откатывают за часы или дни, и задержка отсекает большинство таких
  # историй до того, как они попадут в CI.
  cooldown:
    default-days: 7
