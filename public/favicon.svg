<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <clipPath id="racket-clip">
      <ellipse cx="244" cy="210" rx="108" ry="122"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glow circle -->
  <circle cx="248" cy="224" r="160" fill="#7c3aed" opacity="0.18"/>

  <!-- Strings clipped to racket head -->
  <g clip-path="url(#racket-clip)">
    <!-- Horizontal -->
    <line x1="136" y1="164" x2="352" y2="164" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="136" y1="196" x2="352" y2="196" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="136" y1="228" x2="352" y2="228" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="136" y1="260" x2="352" y2="260" stroke="#c084fc" stroke-width="4" opacity="0.55"/>
    <line x1="136" y1="292" x2="352" y2="292" stroke="#c084fc" stroke-width="4" opacity="0.45"/>
    <line x1="136" y1="132" x2="352" y2="132" stroke="#c084fc" stroke-width="4" opacity="0.45"/>
    <!-- Vertical -->
    <line x1="180" y1="88" x2="180" y2="332" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="212" y1="88" x2="212" y2="332" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="244" y1="88" x2="244" y2="332" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="276" y1="88" x2="276" y2="332" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
    <line x1="308" y1="88" x2="308" y2="332" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- Racket head outline (поверх струн) -->
  <ellipse cx="244" cy="210" rx="108" ry="122" fill="none" stroke="#c084fc" stroke-width="14"/>

  <!-- Handle -->
  <rect x="228" y="332" width="32" height="110" rx="16" fill="#c084fc"/>
  <line x1="232" y1="355" x2="256" y2="355" stroke="#4c1d95" stroke-width="5" opacity="0.6"/>
  <line x1="232" y1="375" x2="256" y2="375" stroke="#4c1d95" stroke-width="5" opacity="0.6"/>
  <line x1="232" y1="395" x2="256" y2="395" stroke="#4c1d95" stroke-width="5" opacity="0.6"/>
  <line x1="232" y1="415" x2="256" y2="415" stroke="#4c1d95" stroke-width="5" opacity="0.6"/>

  <!-- Tennis ball -->
  <circle cx="378" cy="378" r="72" fill="#d4f542"/>
  <path d="M318 355 Q342 378 318 401" fill="none" stroke="white" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  <path d="M438 355 Q414 378 438 401" fill="none" stroke="white" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
</svg>
