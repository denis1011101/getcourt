<!--
  Исходник картинки для og:image (public/og-image.png). Пересобрать:

    google-chrome --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --screenshot=public/og-image.png script/og-image.html

  Размер 1200x630 — то, что ждут телеграм, слак и соцсети; палитра взята из
  иконки приложения (#1b0d38 фон, #d4f542 мяч).
-->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  display:flex;align-items:center;gap:64px;padding:0 88px;
  font-family:"Noto Sans","DejaVu Sans",sans-serif;
  background:radial-gradient(120% 140% at 12% 8%, #4a218f 0%, #2c1459 55%, #1b0d38 100%);
  color:#fff;position:relative;overflow:hidden;
}
.glow{position:absolute;width:760px;height:760px;right:-260px;bottom:-360px;border-radius:50%;
  background:radial-gradient(circle, rgba(212,245,66,.20) 0%, rgba(212,245,66,0) 68%)}
img{width:260px;height:260px;border-radius:56px;box-shadow:0 30px 70px rgba(0,0,0,.45);flex:none;position:relative}
.text{position:relative}
h1{font-size:104px;font-weight:800;letter-spacing:-3px;line-height:1}
h1 span{color:#d4f542}
p{margin-top:22px;font-size:35px;line-height:1.32;color:#d9d2f0;max-width:640px}
.url{margin-top:34px;display:inline-block;font-size:27px;font-weight:600;letter-spacing:.5px;
  color:#1b0d38;background:#d4f542;padding:12px 26px;border-radius:999px}
</style></head><body>
<div class="glow"></div>
<img src="../public/android-chrome-512x512.png">
<div class="text">
  <h1>Get<span>Court</span></h1>
  <p>Find partners for tennis, padel, table tennis and squash — courts, games and ratings.</p>
  <span class="url">getcourt.co</span>
</div>
</body></html>
